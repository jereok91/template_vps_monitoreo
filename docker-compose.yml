services:
  # 1. Monitorea el Servidor (CPU/RAM/Disco del VPS)
  node_exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - 9100:9100

  # 2. Monitorea los Contenedores Docker (Consumo por App)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - 8080:8080

  # 3. Envía los access logs de Traefik a un Loki central
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    # UID/GID 473 es el usuario `alloy` dentro de la imagen.
    user: "473:473"
    environment:
      VPS_NAME: ${VPS_NAME:?Set VPS_NAME}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?Set LOKI_PUSH_URL}
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      # Repo / `docker compose` local: ./files/config.alloy
      # Dokploy: cambiar a ../files/config.alloy (el compose vive en <app>/code/)
      - ./files/config.alloy:/etc/alloy/config.alloy:ro
      # Dokploy escribe el access log acá. En un VPS sin Dokploy, apuntá
      # esto al directorio real donde Traefik deja sus logs.
      - /etc/dokploy/traefik/dynamic:/var/log/traefik:ro
      - alloy_data:/var/lib/alloy/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alloy_data:
